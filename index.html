<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luxury Cars Shop</title>

<!-- PayPal SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=AT5OJRTj_FvYP4dk5tml6Mvy1zMlTXr0IbWqqPvtxek0ZjDJfIdmw6T0-h_xWS5sHMjFZ2jkwgUUsxq8&currency=USD"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 20px;
    }

    .car-list {
        max-width: 700px;
    }

    .car-item {
        background: white;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .car-info {
        display: flex;
        flex-direction: column;
    }

    .car-name {
        font-weight: bold;
        margin-bottom: 4px;
    }

    .car-price {
        color: #555;
        font-size: 14px;
    }

    .buy-btn {
        padding: 8px 14px;
        background: black;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .buy-btn:hover {
        transform: scale(1.05);
        background: #333;
    }

    .checkmark {
        font-size: 22px;
        color: green;
        font-weight: bold;
        animation: pop 0.3s ease;
    }

    @keyframes pop {
        0% { transform: scale(0.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }

    #popup {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #222;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
        z-index: 1000;
    }

    #popup.show {
        opacity: 1;
        transform: translateY(0);
    }

    #paypal-area {
        margin-top: 30px;
        max-width: 400px;
        padding: 15px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: none;
    }

    #selected-car {
        font-weight: bold;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<h1>Luxury Cars</h1>

<div class="car-list">
    <div class="car-item">
        <div class="car-info">
            <span class="car-name">Ferrari F8 Tributo</span>
            <span class="car-price">$280,000</span>
        </div>
        <button class="buy-btn" onclick="buy(this, 'Ferrari F8 Tributo', 280000)">Buy it</button>
    </div>

    <div class="car-item">
        <div class="car-info">
            <span class="car-name">Lamborghini Aventador</span>
            <span class="car-price">$450,000</span>
        </div>
        <button class="buy-btn" onclick="buy(this, 'Lamborghini Aventador', 450000)">Buy it</button>
    </div>

    <div class="car-item">
        <div class="car-info">
            <span class="car-name">Rolls-Royce Phantom</span>
            <span class="car-price">$550,000</span>
        </div>
        <button class="buy-btn" onclick="buy(this, 'Rolls-Royce Phantom', 550000)">Buy it</button>
    </div>

    <div class="car-item">
        <div class="car-info">
            <span class="car-name">Bentley Continental GT</span>
            <span class="car-price">$240,000</span>
        </div>
        <button class="buy-btn" onclick="buy(this, 'Bentley Continental GT', 240000)">Buy it</button>
    </div>
</div>

<div id="popup"></div>

<div id="paypal-area">
    <div id="selected-car"></div>
    <div id="paypal-button-container"></div>
</div>

<script>
let currentPrice = 0;
let currentCar = '';

function showPopup(message) {
    const popup = document.getElementById('popup');
    popup.textContent = message;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 2000);
}

function buy(button, carName, price) {
    button.outerHTML = '<span class="checkmark">✔️</span>';
    showPopup(`You selected: ${carName}`);

    currentPrice = price;
    currentCar = carName;

    const paypalArea = document.getElementById('paypal-area');
    const selectedCar = document.getElementById('selected-car');
    paypalArea.style.display = 'block';
    selectedCar.textContent =
        `Complete purchase with PayPal: ${carName} — $${price.toLocaleString()}`;

    const container = document.getElementById('paypal-button-container');
    container.innerHTML = '';

    paypal.Buttons({
        createOrder: function(data, actions) {
            return fetch("https://g-ta-cats.onrender.com/create-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ price: currentPrice, car: currentCar })
            })
            .then(res => res.json())
            .then(order => order.id);
        },

        onApprove: function(data, actions) {
            return fetch("https://g-ta-cats.onrender.com/capture-order", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ orderID: data.orderID })
            })
            .then(res => res.json())
            .then(details => {
                showPopup('Payment completed by ' + details.payer.name.given_name);
            });
        },

        onError: function(err) {
            console.error(err);
            showPopup('There was an error with PayPal.');
        }
    }).render('#paypal-button-container');
}
</script>

</body>
</html>
