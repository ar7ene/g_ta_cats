<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luxury Cars Shop</title>

<!-- PayPal SDK -->
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID_HERE&currency=USD"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 20px;
    }

    .car-list {
        max-width: 600px;
    }

    .car-item {
        background: white;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .buy-btn {
        padding: 8px 14px;
        background: black;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .buy-btn:hover {
        transform: scale(1.05);
    }

    .checkmark {
        font-size: 22px;
        color: green;
        font-weight: bold;
    }

    /* Popup */
    #popup {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #222;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #popup.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* PayPal container */
    #paypal-area {
        margin-top: 30px;
        display: none;
        max-width: 400px;
    }

    #selected-car {
        font-weight: bold;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<h1>Luxury Cars</h1>

<div class="car-list">
    <div class="car-item">
        <span>Ferrari F8 Tributo — $280,000</span>
        <button class="buy-btn" onclick="buy(this, 'Ferrari F8 Tributo', 280000)">Buy it</button>
    </div>

    <div class="car-item">
        <span>Lamborghini Aventador — $450,000</span>
        <button class="buy-btn" onclick="buy(this, 'Lamborghini Aventador', 450000)">Buy it</button>
    </div>

    <div class="car-item">
        <span>Rolls-Royce Phantom — $550,000</span>
        <button class="buy-btn" onclick="buy(this, 'Rolls-Royce Phantom', 550000)">Buy it</button>
    </div>

    <div class="car-item">
        <span>Bentley Continental GT — $240,000</span>
        <button class="buy-btn" onclick="buy(this, 'Bentley Continental GT', 240000)">Buy it</button>
    </div>
</div>

<!-- Popup -->
<div id="popup"></div>

<!-- PayPal Checkout Area -->
<div id="paypal-area">
    <div id="selected-car"></div>
    <div id="paypal-button-container"></div>
</div>

<script>
let currentPrice = 0;

// Buy button logic
function buy(button, carName, price) {
    // Replace button with checkmark
    button.outerHTML = '<span class="checkmark">✔️</span>';

    // Show popup
    const popup = document.getElementById('popup');
    popup.textContent = `You selected: ${carName}`;
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 2000);

    // Show PayPal checkout
    currentPrice = price;
    document.getElementById('selected-car').textContent =
        `Complete purchase with PayPal: ${carName} — $${price.toLocaleString()}`;
    document.getElementById('paypal-area').style.display = 'block';

    // Render PayPal button
    paypal.Buttons({
        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: { value: price.toString() }
                }]
            });
        },
        onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
                alert('Payment completed by ' + details.payer.name.given_name);
            });
        }
    }).render('#paypal-button-container');
}
</script>

</body>
</html>
